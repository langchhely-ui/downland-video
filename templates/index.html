<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downland Video — TikTok & Facebook</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Khmer OS", system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 560px;
    }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
    .status {
      margin-top: 16px;
      text-align: center;
      min-height: 20px;
      font-size: 0.9rem;
    }
    .status.error { color: var(--danger); }
    .result {
      margin-top: 20px;
      display: none;
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
    }
    .result img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 12px;
      max-height: 320px;
      object-fit: cover;
    }
    .result .title { font-weight: 600; margin-bottom: 4px; }
    .result .author { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
    .badge {
      display: inline-block;
      background: #064e3b;
      color: #6ee7b7;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-bottom: 12px;
    }
    .download-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      width: 100%;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Downland Video</h1>
    <p class="subtitle">ដោនឡូតវីដេអូ TikTok & Facebook — គ្មាន Watermark</p>

    <div class="card">
      <div class="input-row">
        <input type="text" id="url" placeholder="បិទភ្ជាប់ link វីដេអូនៅទីនេះ..." />
        <button id="fetchBtn" onclick="fetchVideo()">ដោនឡូត</button>
      </div>
      <p class="hint">គាំទ្រ: TikTok (vt.tiktok, vm.tiktok) និង Facebook (fb.watch)</p>

      <div class="status" id="status"></div>

      <div class="result" id="result">
        <span class="badge" id="badge">✓ គ្មាន Watermark</span>
        <img id="thumb" alt="thumbnail" />
        <div class="title" id="vtitle"></div>
        <div class="author" id="vauthor"></div>
        <a class="download-btn" id="dlLink"><button style="width:100%">💾 រក្សាទុកវីដេអូ (MP4)</button></a>
      </div>
    </div>

    <footer>សម្រាប់ការប្រើប្រាស់ផ្ទាល់ខ្លួន។ សូមគោរពសិទ្ធិម្ចាស់ស្នាដៃ។</footer>
  </div>

  <script>
    const urlInput = document.getElementById("url");
    const fetchBtn = document.getElementById("fetchBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") fetchVideo();
    });

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (isError ? " error" : "");
    }

    async function fetchVideo() {
      const url = urlInput.value.trim();
      resultEl.style.display = "none";

      if (!url) {
        setStatus("សូមបញ្ចូល link វីដេអូ", true);
        return;
      }

      fetchBtn.disabled = true;
      setStatus("");
      statusEl.innerHTML = '<span class="spinner"></span> កំពុងដំណើរការ...';

      try {
        const res = await fetch("/api/info", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) {
          setStatus(data.error || "មានបញ្ហា", true);
          return;
        }

        // Populate result
        document.getElementById("vtitle").textContent = data.title || "";
        document.getElementById("vauthor").textContent = data.author ? "@" + data.author : "";

        const thumb = document.getElementById("thumb");
        if (data.thumbnail) {
          thumb.src = data.thumbnail;
          thumb.style.display = "block";
        } else {
          thumb.style.display = "none";
        }

        const dlUrl = "/download?source=" + encodeURIComponent(data.source) +
                      "&name=" + encodeURIComponent(data.title || "video");
        document.getElementById("dlLink").href = dlUrl;

        setStatus("");
        resultEl.style.display = "block";
      } catch (err) {
        setStatus("បណ្តាញមានបញ្ហា ឬ server មិនឆ្លើយតប", true);
      } finally {
        fetchBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
